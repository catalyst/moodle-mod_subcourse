name: Release package

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to package without publishing
        required: false
        default: HEAD

permissions:
  contents: read

jobs:
  package:
    name: Validate release package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          coverage: none

      - name: Build package twice
        shell: bash
        env:
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v10.2.0' }}
        run: |
          ci/build-release.sh "$RELEASE_REF" "$RELEASE_TAG" dist-first
          ci/build-release.sh "$RELEASE_REF" "$RELEASE_TAG" dist-second
          cmp dist-first/mod_subcourse-v10.2.0.zip dist-second/mod_subcourse-v10.2.0.zip
          mkdir dist
          cp dist-first/mod_subcourse-v10.2.0.zip dist/
          cp dist-first/mod_subcourse-v10.2.0.zip.sha256 dist/

      - name: Upload validated package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mod_subcourse-v10.2.0
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download validated package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mod_subcourse-v10.2.0
          path: dist

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/mod_subcourse-v10.2.0.zip
          dist/mod_subcourse-v10.2.0.zip.sha256
          --verify-tag
          --generate-notes
          --title "Subcourse $RELEASE_TAG"

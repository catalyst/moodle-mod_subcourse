name: Plugin CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-phpunit:
    name: Static/PHPUnit (${{ matrix.moodle-branch }}, PHP ${{ matrix.php }}, ${{ matrix.database }})
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: ${{ matrix.database == 'pgsql' && matrix.postgres_image || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
      mariadb:
        image: ${{ matrix.database == 'mariadb' && matrix.mariadb_image || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include:
          - moodle-branch: MOODLE_405_STABLE
            php: '8.1'
            database: pgsql
            postgres_image: postgres:13
            mariadb_image: ''
          - moodle-branch: MOODLE_405_STABLE
            php: '8.3'
            database: mariadb
            postgres_image: ''
            mariadb_image: mariadb:10.11
          - moodle-branch: MOODLE_500_STABLE
            php: '8.2'
            database: pgsql
            postgres_image: postgres:14
            mariadb_image: ''
          - moodle-branch: MOODLE_500_STABLE
            php: '8.4'
            database: mariadb
            postgres_image: ''
            mariadb_image: mariadb:10.11

    env:
      DB: ${{ matrix.database }}
      MOODLE_BRANCH: ${{ matrix.moodle-branch }}

    steps:
      - name: Check out plugin
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: plugin
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, soap, zip, gd, xml, pgsql, mysqli, sodium
          ini-values: max_input_vars=5000, opcache.enable_cli=1, opcache.jit=disable
          coverage: none

      - name: Install OS packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          sudo locale-gen en_AU.UTF-8

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(pwd)/ci/bin" >> "$GITHUB_PATH"
          echo "$(pwd)/ci/vendor/bin" >> "$GITHUB_PATH"
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"

      - name: Install Moodle test site
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1

      - name: Git whitespace check
        working-directory: plugin
        run: git diff --check

      - name: Validate install.xml
        working-directory: plugin
        run: xmllint --noout db/install.xml

      - name: PHP syntax validation
        run: moodle-plugin-ci phplint

      - name: Moodle code checker
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc checker
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Moodle plugin validation
        run: moodle-plugin-ci validate

      - name: Upgrade savepoint check
        run: moodle-plugin-ci savepoints

      - name: Mustache lint
        run: moodle-plugin-ci mustache

      - name: CSS and Gherkin lint
        working-directory: plugin
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '*.css' -o -name '*.feature' \) -print -quit | grep -q .; then
              cd ..
              moodle-plugin-ci grunt --max-lint-warnings 0
          else
              echo 'No CSS or Gherkin sources found; skipping frontend lint.'
          fi

      - name: Explicit PHPUnit files
        shell: bash
        run: |
          set -euo pipefail

          run_phpunit_filter() {
              local filter="$1"
              local output
              local status

              echo "::group::PHPUnit ${filter}"
              set +e
              output="$(moodle-plugin-ci phpunit --fail-on-warning --filter "${filter}" 2>&1)"
              status=$?
              set -e
              printf '%s\n' "${output}"
              echo '::endgroup::'

              if grep -Eiq 'No tests executed|No tests found|OK \((0|zero) tests|Tests:[[:space:]]+0' <<< "${output}"; then
                  echo "No PHPUnit tests executed for filter ${filter}" >&2
                  exit 1
              fi

              if [[ "${status}" -ne 0 ]]; then
                  exit "${status}"
              fi
          }

          run_phpunit_filter 'mod_subcourse\\completion_test'
          run_phpunit_filter 'mod_subcourse\\upgrade_test'
          run_phpunit_filter 'mod_subcourse\\externallib_test'
          run_phpunit_filter 'mod_subcourse\\locallib_test'
          run_phpunit_filter 'mod_subcourse\\output_mobile_test'

      - name: Aggregate plugin PHPUnit suite
        run: moodle-plugin-ci phpunit --fail-on-warning --testsuite mod_subcourse_testsuite

  behat:
    name: Behat (${{ matrix.moodle-branch }}, PHP ${{ matrix.php }}, pgsql)
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: ${{ matrix.postgres_image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include:
          - moodle-branch: MOODLE_405_STABLE
            php: '8.3'
            postgres_image: postgres:13
          - moodle-branch: MOODLE_500_STABLE
            php: '8.4'
            postgres_image: postgres:14

    env:
      DB: pgsql
      MOODLE_BRANCH: ${{ matrix.moodle-branch }}

    steps:
      - name: Check out plugin
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: plugin
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, soap, zip, gd, xml, pgsql, mysqli, sodium
          ini-values: max_input_vars=5000, opcache.enable_cli=1, opcache.jit=disable
          coverage: none

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(pwd)/ci/bin" >> "$GITHUB_PATH"
          echo "$(pwd)/ci/vendor/bin" >> "$GITHUB_PATH"
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"
          sudo locale-gen en_AU.UTF-8

      - name: Install Moodle test site
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1

      - name: Behat @mod_subcourse scenarios
        id: behat
        run: moodle-plugin-ci behat --profile chrome --tags='@mod_subcourse' --scss-deprecations

      - name: Upload Behat faildump
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: behat-faildump-${{ matrix.moodle-branch }}-php${{ matrix.php }}-pgsql
          path: moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

  required-checks:
    name: Required checks
    if: ${{ always() }}
    needs:
      - static-and-phpunit
      - behat
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required jobs
        env:
          STATIC_RESULT: ${{ needs.static-and-phpunit.result }}
          BEHAT_RESULT: ${{ needs.behat.result }}
        run: |
          if [[ "$STATIC_RESULT" != 'success' || "$BEHAT_RESULT" != 'success' ]]; then
              echo "Required jobs did not succeed: static-and-phpunit=$STATIC_RESULT behat=$BEHAT_RESULT" >&2
              exit 1
          fi
